<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KK 聊天室</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#243047;background:#eef2f8}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px}.app{width:min(820px,100%);height:min(820px,calc(100dvh - 48px));background:white;border:1px solid #dce3ef;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 16px 60px #23395612}header{padding:22px 26px;border-bottom:1px solid #e8edf5;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:21px;margin:0 0 5px}.subtitle{font-size:13px;color:#738096;margin:0}.connection{display:flex;gap:10px;align-items:center;flex-shrink:0}#status{font-size:13px;color:#738096}#status[data-state=online]{color:#16835b}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:#edf1f8;color:#354763}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,textarea:focus-visible{outline:3px solid #a7c2ff;outline-offset:2px}#messages{flex:1;overflow:auto;padding:22px 26px;list-style:none;margin:0;display:flex;flex-direction:column;gap:18px}#empty{margin:auto;text-align:center;color:#8590a3;line-height:1.9}.message{max-width:90%;align-self:flex-start}.meta{font-size:12px;color:#77849a;margin-bottom:6px;overflow-wrap:anywhere}.bubble{padding:12px 16px;border-radius:3px 15px 15px;background:#eff3fa;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;font-size:15px}footer{padding:16px 24px 20px;border-top:1px solid #e8edf5}textarea{resize:none;width:100%;min-height:80px;border:1px solid #dce3ef;background:#fafbfe;border-radius:12px;padding:12px;font:inherit;color:inherit}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}.hint{font-size:12px;color:#8590a3}#send{background:#4267e9;color:white;min-width:88px}#notice{font-size:13px;color:#a34c25;min-height:20px;margin:0 0 8px}#counter{white-space:nowrap} @media(max-width:560px){body{padding:0}.app{height:100dvh;border:0;border-radius:0}header{padding:18px}#messages{padding:18px}footer{padding:14px}.subtitle{max-width:210px}.hint{font-size:11px}}
</style>
</head>
<body>
<main class="app">
<header><div><h1>KK 聊天室</h1><p class="subtitle">公共聊天室 · 消息仅保留在当前页面</p></div><div class="connection"><span id="status" role="status">未连接</span><button id="connect" type="button">连接</button></div></header>
<ul id="messages" aria-label="聊天消息" aria-live="polite"><li id="empty">还没有消息<br>开两个窗口，试着打个招呼吧。</li></ul>
<footer>
<p id="notice" role="status"></p>
<form id="form"><label for="content" class="hint">消息内容</label><textarea id="content" placeholder="说点什么……" aria-describedby="notice counter"></textarea><div class="actions"><span class="hint">Enter 发送 · Shift + Enter 换行</span><span id="counter" class="hint">0 / 512 字节</span><button id="send" type="submit" disabled>发送</button></div></form>
</footer>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const statusEl = $('status'), connectButton = $('connect'), input = $('content');
const sendButton = $('send'), notice = $('notice'), list = $('messages');
const encoder = new TextEncoder();
let socket = null;
let messages = [];
let arrival = 0;
const payload = () => JSON.stringify({messageType:'TEXT', content:input.value.trim()});
function refresh() {
  const bytes = encoder.encode(payload()).length;
  $('counter').textContent = `${bytes} / 512 字节`;
  sendButton.disabled = !socket || socket.readyState !== WebSocket.OPEN || !input.value.trim() || bytes > 512;
}
function setState(text, state) { statusEl.textContent=text; statusEl.dataset.state=state; refresh(); }
function render() {
  const nearBottom = list.scrollHeight-list.scrollTop-list.clientHeight < 90;
  const nodes = messages.map(({message}) => {
    const item=document.createElement('li'); item.className='message';
    const meta=document.createElement('div'); meta.className='meta';
    const time=Number(message.createdAt);
    const date=new Date(time);
    const stamp=time>0 && Number.isFinite(date.getTime()) ? date.toLocaleTimeString('zh-CN',{hour12:false}) : '';
    meta.textContent=[`用户 ${message.senderId || '未知'}`,stamp,`#${message.sequence ?? '?'}`].filter(Boolean).join(' · ');
    const body=document.createElement('div'); body.className='bubble';
    body.textContent=message.hidden ? '此消息已隐藏' : message.content;
    item.append(meta,body); return item;
  });
  list.replaceChildren(...nodes);
  if(nearBottom) list.scrollTop=list.scrollHeight;
}
function connect() {
  if(location.protocol!=='http:' && location.protocol!=='https:') {
    notice.textContent='请启动 Go 服务，然后通过服务地址打开此页面，不要直接双击 HTML 文件。'; return;
  }
  if(socket && socket.readyState!==WebSocket.CLOSED) return;
  notice.textContent='';
  const ws=new WebSocket(`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws`);
  socket=ws; connectButton.disabled=true; setState('连接中…','connecting');
  ws.onopen=()=>{setState('● 已连接','online');connectButton.disabled=false;connectButton.textContent='断开';};
  ws.onmessage=event=>{
    // 同时兼容一帧一个 JSON，以及旧后端按换行合并多个 JSON 的格式。
    if(typeof event.data!=='string') {notice.textContent='收到了不支持的二进制消息。';return;}
    let changed=false;
    for(const line of event.data.split('\n').filter(x=>x.trim())) {
      try {
        const message=JSON.parse(line);
        if(!message || typeof message.content!=='string') throw new Error('消息缺少正文');
        messages.push({message,arrival:arrival++}); changed=true;
      } catch(error) {notice.textContent='收到的消息格式不正确：'+error.message;}
    }
    if(changed) {
      messages.sort((a,b)=>{
        if(a.message.hubId!==b.message.hubId) return a.arrival-b.arrival;
        const x=a.message.sequence,y=b.message.sequence;
        return Number.isFinite(x)&&Number.isFinite(y) ? x-y || a.arrival-b.arrival : a.arrival-b.arrival;
      });
      // 限制页面保留数量，避免长时间打开后 DOM 无限增长。
      if(messages.length>500) messages=messages.slice(-500);
      render();
    }
  };
  ws.onerror=()=>{notice.textContent='连接失败，请确认 Go 服务已启动，并通过同一服务地址打开页面。';};
  ws.onclose=event=>{
    if(socket!==ws) return;
    socket=null; connectButton.disabled=false;connectButton.textContent='重新连接';setState('○ 已断开','offline');
    if(event.code===1009) notice.textContent='消息超过服务器大小限制，请缩短后重新连接。';
    else if(!notice.textContent) notice.textContent='连接已断开，重新连接后可继续聊天。';
    // 当前后端重启后序号从头计数，重连时清空本页记录，避免混排。
  };
}
connectButton.onclick=()=>{
  if(socket?.readyState===WebSocket.OPEN) {socket.close(1000,'用户断开');return;}
  messages=[];arrival=0;list.replaceChildren();
  const empty=document.createElement('li');empty.id='empty';empty.textContent='等待新消息……';list.append(empty);
  connect();
};
$('form').onsubmit=event=>{
  event.preventDefault(); refresh();
  if(encoder.encode(payload()).length>512){notice.textContent='消息过长：正文和 JSON 字段合计不能超过 512 字节。';return;}
  if(sendButton.disabled) return;
  try {socket.send(payload());input.value='';notice.textContent='';refresh();input.focus();}
  catch(error){notice.textContent='发送失败：'+error.message;}
};
input.oninput=refresh;
input.onkeydown=event=>{
  if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();$('form').requestSubmit();}
};
window.addEventListener('pagehide',()=>socket?.close(1000,'页面关闭'));
refresh();connect();
</script>
</body>
</html>
